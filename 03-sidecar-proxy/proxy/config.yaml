# Proxy configuration
upstream:
  host: api.anthropic.com
  port: 443
  scheme: https

listen:
  host: 127.0.0.1
  port: 8080

# The sentinel value that the main container has as its API key.
# The proxy replaces this with the real key from its own environment.
sentinel_key: "FAKE_KEY_REPLACED_BY_PROXY"

# Header to inject the real credential into
credential_header: "x-api-key"

# GitHub MITM proxy (CONNECT + TLS interception)
github:
  # Sentinel value for GH_TOKEN in the main container
  sentinel_token: "FAKE_GH_TOKEN_REPLACED_BY_PROXY"
  # Hosts allowed for CONNECT MITM
  allowed_hosts:
    - github.com
    - api.github.com
  # Certs are generated at runtime by entrypoint.sh (ephemeral, 1-day validity)
  cert_dir: /app/certs
  shared_cert_dir: /certs
