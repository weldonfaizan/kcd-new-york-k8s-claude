apiVersion: v1
kind: ConfigMap
metadata:
  name: proxy-config
  namespace: 03-sidecar-proxy
data:
  config.yaml: |
    domains:
      - host: api.anthropic.com
        inject_header: x-api-key
        credential_env: ANTHROPIC_API_KEY

      - host: github.com
        inject_auth: basic
        credential_env: GH_TOKEN

      - host: api.github.com
        inject_auth: basic
        credential_env: GH_TOKEN

      - host: httpbin.org
        action: passthrough

      - host: bedrock-runtime.us-west-2.amazonaws.com
        action: passthrough

      - host: bedrock-runtime.us-east-1.amazonaws.com
        action: passthrough

      - host: sts.us-west-2.amazonaws.com
        action: passthrough
