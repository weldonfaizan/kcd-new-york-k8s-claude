apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: claude-workspace-pvc
  namespace: 05-developer-agent
spec:
  accessModes:
    - ReadWriteOnce
  resources:
    requests:
      storage: 10Gi
---
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: claude-memory-pvc
  namespace: 05-developer-agent
spec:
  accessModes:
    - ReadWriteOnce
  resources:
    requests:
      storage: 5Gi
