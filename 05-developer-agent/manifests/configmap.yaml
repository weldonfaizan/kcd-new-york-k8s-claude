apiVersion: v1
kind: ConfigMap
metadata:
  name: developer-config
  namespace: 05-developer-agent
data:
  TARGET_REPO: "${TESTING_REPO}"
  ANTHROPIC_MODEL: "claude-haiku-4-5-20251001"
  AGENT_GIT_EMAIL: "claude-developer@bot.local"
  AGENT_GIT_NAME: "Claude Developer"
  ENABLE_SESSION_RESUME: "true"
  AGENT_TASK: ""

  # Generic entrypoint shared by all agents (04-reviewer, 05-developer)
  # Parameterized via env vars: AGENT_GIT_EMAIL, AGENT_GIT_NAME,
  # TARGET_REPO, FEATURE_REQUEST (optional), ENABLE_SESSION_RESUME (optional)
  entrypoint.sh: |
    #!/bin/bash
    set -e

    git config --global user.email "${AGENT_GIT_EMAIL:-claude-agent@bot.local}"
    git config --global user.name "${AGENT_GIT_NAME:-Claude Agent}"

    # Route only git and gh through the credential proxy (not all HTTPS traffic)
    if [ -f /certs/combined-ca.crt ]; then
      git config --global http.proxy http://127.0.0.1:8080
      git config --global http.sslCAInfo /certs/combined-ca.crt
      mkdir -p "$HOME/bin"
      cat > "$HOME/bin/gh" << 'GHWRAPPER'
    #!/bin/bash
    exec env HTTPS_PROXY=http://127.0.0.1:8080 SSL_CERT_FILE=/certs/combined-ca.crt /usr/bin/gh "$@"
    GHWRAPPER
      chmod +x "$HOME/bin/gh"
      export PATH="$HOME/bin:$PATH"
    fi

    # Build prompt: inject env vars as context, then append the prompt file
    PROMPT="TARGET_REPO=${TARGET_REPO}"
    [ -n "${AGENT_TASK:-}" ] && PROMPT="${PROMPT}
    AGENT_TASK=${AGENT_TASK:-}"
    PROMPT="${PROMPT}

    $(cat /prompts/prompt.md)"

    echo "Starting ${AGENT_GIT_NAME:-Claude Agent}..."
    echo "Target repo: ${TARGET_REPO}"
    [ -n "${AGENT_TASK:-}" ] && echo "Task: ${AGENT_TASK}"
    echo "Model: ${ANTHROPIC_MODEL}"
    echo "---"

    # Run Claude Code with stream-json output, filtered through jq for readable logs
    CLAUDE_ARGS="-p --dangerously-skip-permissions --verbose --output-format stream-json --model ${ANTHROPIC_MODEL}"

    # Session resume (opt-in via ENABLE_SESSION_RESUME=true)
    if [ "${ENABLE_SESSION_RESUME:-}" = "true" ]; then
      PREV_RUN_FLAG="/home/claude/.claude/.agent-ran"
      if [ -f "$PREV_RUN_FLAG" ]; then
        echo "Previous session found — resuming with --continue"
        CLAUDE_ARGS="$CLAUDE_ARGS --continue"
      else
        echo "First run — starting fresh session"
      fi
    fi

    RAW_LOG="/tmp/claude-raw-$(date +%s).jsonl"
    CLAUDE_EXIT=0

    timeout 3600 claude $CLAUDE_ARGS -- "$PROMPT" \
      | tee "$RAW_LOG" \
      | jq --unbuffered -r '
    if .type == "assistant" then
      .message.content[]? |
      if .type == "text" then ">>> " + .text[0:5000]
      elif .type == "tool_use" then "[" + .name + "] " + ((.input | tostring)[0:3000])
      else empty end
    elif .type == "result" then
      "[done] " + (.result // "complete")[0:5000]
    else empty end' || CLAUDE_EXIT=$?

    # Mark session for resume on next run
    if [ "${ENABLE_SESSION_RESUME:-}" = "true" ] && [ "$CLAUDE_EXIT" -eq 0 ]; then
      touch "/home/claude/.claude/.agent-ran"
    fi

    # If Claude timed out, salvage partial results
    if [ "$CLAUDE_EXIT" -eq 124 ]; then
      echo "=== TIMEOUT: Claude exceeded time limit ==="
      timeout 300 claude -p --dangerously-skip-permissions -- \
        "The previous process timed out. Check what partial results exist and write a summary to /tmp/partial-report.md."
    fi

    echo "=== Complete (exit: $CLAUDE_EXIT) ==="

  # Prompt mounted into the container at /prompts/prompt.md
  agent-prompt: |
    You are an autonomous software developer agent for the GitHub repository specified in TARGET_REPO.
    You work from a feature roadmap defined in SPEC.md at the repo root. Each run, you pick up the next unclaimed feature and implement it.

    ## Setup

    Clone the repository if not already present, then fetch latest:
    ```bash
    cd /workspace
    if [ ! -d "repo" ]; then
      gh repo clone "$TARGET_REPO" repo
    fi
    cd repo
    git fetch --all
    git checkout main
    git pull
    npm install
    ```

    ## Check for Existing Work

    Check if you already have an open PR with the sentinel tag `<!-- claude-developer -->` in the body:
    ```bash
    gh pr list --state open --json number,title,headRefName,body
    ```

    ### If an open PR exists (resume workflow):

    1. Check out the PR branch and get the latest:
       ```bash
       gh pr checkout <number>
       git pull
       ```

    2. Read all review comments and reviews:
       ```bash
       gh pr view <number> --comments --json comments,reviews,body
       ```

    3. Address every piece of feedback:
       - Make the exact changes requested
       - Run `npm test` to verify tests pass
       - Commit with a message referencing what was addressed

    4. Push the updated branch:
       ```bash
       git push
       ```

    5. Leave a comment summarizing what was fixed:
       ```bash
       gh pr comment <number> --body "<!-- claude-developer -->
       ## Updates

       Addressed all review feedback:
       <bullet list of changes made>"
       ```

    ### If no open PR exists (new feature):

    1. Read `SPEC.md` in the repo root to find the feature roadmap.

    2. Find the FIRST feature with an unchecked box `- [ ]`.
       - If ALL features are checked `- [x]`, print "All roadmap features are implemented!" and exit.

    3. Create a new branch named after the feature:
       ```bash
       git checkout -b claude/feature/<short-slug-from-feature-name>
       ```

    4. Implement ONLY that one feature:
       - Read CLAUDE.md in the repo for conventions
       - Make only the changes needed for this feature
       - **IMPORTANT: Do NOT touch the test files. Do NOT add any tests. Do NOT modify test/app.test.js.**
         The reviewer will explicitly request tests. You will add them in a follow-up commit.
         If you add tests now, you are not following instructions.

    5. Mark the feature as done in SPEC.md by changing `- [ ]` to `- [x]` for the feature you implemented.

    6. Commit the implementation and the SPEC.md update:
       ```bash
       git add src/ public/ SPEC.md
       git commit -m "feat: <description>"
       ```

    7. Push and open a PR:
       ```bash
       git push -u origin HEAD
       gh pr create --title "<descriptive title>" --body "<!-- claude-developer -->
       ## What

       Implements roadmap feature: **<feature name from SPEC.md>**

       <what was implemented>

       ## How to test manually

       <curl examples or steps>

       Note: tests not included in this PR yet."
       ```

    ## Exit Summary

    Print a summary of what was done: new PR created (include URL) or existing PR updated (include what changed).
