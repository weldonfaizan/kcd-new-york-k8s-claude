apiVersion: batch/v1
kind: Job
metadata:
  name: claude-hello
  namespace: 02-claude-k8s-job
spec:
  backoffLimit: 0
  template:
    spec:
      restartPolicy: Never
      containers:
        - name: claude-code
          image: claude-code:latest
          imagePullPolicy: Never  # Using Kind-loaded image
          command:
            - /bin/bash
            - -c
            - |
              if [ "${LOG_FORMAT}" = "json" ]; then
                claude -p --dangerously-skip-permissions --verbose --output-format stream-json \
                  --model "${ANTHROPIC_MODEL}" -- "${PROMPT}"
              else
                claude -p --dangerously-skip-permissions --verbose --output-format stream-json \
                  --model "${ANTHROPIC_MODEL}" -- "${PROMPT}" \
                  | jq --unbuffered -r '
                if .type == "assistant" then
                  .message.content[]? |
                  if .type == "text" then ">>> " + .text[0:5000]
                  elif .type == "tool_use" then "[" + .name + "] " + ((.input | tostring)[0:3000])
                  else empty end
                elif .type == "result" then
                  "[done] " + (.result // "complete")[0:5000]
                else empty end'
              fi
          env:
            - name: ANTHROPIC_MODEL
              value: "claude-haiku-4-5-20251001"
            - name: PROMPT
              value: "Print all environment variables you can see"
            - name: LOG_FORMAT
              value: "text"
          envFrom:
            - secretRef:
                name: agent-credentials
          resources:
            requests:
              memory: "256Mi"
              cpu: "100m"
            limits:
              memory: "512Mi"
              cpu: "500m"
