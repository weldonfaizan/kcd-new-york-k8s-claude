# ClaudeCodeAgentSandbox (user-facing orchestrator)
# Standalone mode: creates a Runner directly.
# CronJob mode: creates a CronJob that uses kubectl to create/wait/delete Runners.
apiVersion: kro.run/v1alpha1
kind: ResourceGraphDefinition
metadata:
  name: claudecodeagentsandbox
spec:
  schema:
    apiVersion: v1alpha1
    kind: ClaudeCodeAgentSandbox

    spec:
      agentName: string | required=true description="Display name for the agent (used in git commits)"
      agentEmail: string | default="claude-agent@bot.local" description="Git email for the agent"
      model: string | default="claude-haiku-4-5-20251001" description="Claude model to use"
      repo: string | required=true description="GitHub repository (owner/repo)"
      task: string | default="" description="Optional task description passed as AGENT_TASK env var"
      prompt: string | required=true description="Full agent prompt (mounted at /prompts/prompt.md)"
      schedule: string | default="" description="Cron schedule (empty = one-shot Sandbox, set = CronJob orchestrator)"
      sessionResume: boolean | default=false description="Enable session resume across runs"
      credentials:
        secretName: string | required=true description="Name of the Secret containing ANTHROPIC_API_KEY and GH_TOKEN"

    status:
      configMapName: ${agentConfig.metadata.name}

  resources:

    # --- 1. ConfigMap: entrypoint scripts and prompt ---
    - id: agentConfig
      template:
        apiVersion: v1
        kind: ConfigMap
        metadata:
          name: ${schema.metadata.name}-config
          namespace: ${schema.metadata.namespace}
        data:
          # --- Entrypoint: runs Claude Code with full Bash (used inside Sandbox) ---
          entrypoint.sh: |
            #!/bin/bash
            set -e

            git config --global user.email "${"${AGENT_GIT_EMAIL:-claude-agent@bot.local}"}"
            git config --global user.name "${"${AGENT_GIT_NAME:-Claude Agent}"}"

            # Route only git and gh through the credential proxy (not all HTTPS traffic)
            if [ -f /certs/combined-ca.crt ]; then
              git config --global http.proxy http://127.0.0.1:8080
              git config --global http.sslCAInfo /certs/combined-ca.crt
              mkdir -p "$HOME/bin"
              cat > "$HOME/bin/gh" << 'GHWRAPPER'
            #!/bin/bash
            exec env HTTPS_PROXY=http://127.0.0.1:8080 SSL_CERT_FILE=/certs/combined-ca.crt /usr/bin/gh "$@"
            GHWRAPPER
              chmod +x "$HOME/bin/gh"
              export PATH="$HOME/bin:$PATH"
            fi

            # Build prompt: inject env vars as context, then append the prompt file
            PROMPT="TARGET_REPO=${"${TARGET_REPO}"}"
            [ -n "${"${AGENT_TASK:-}"}" ] && PROMPT="${"${PROMPT}"}
            AGENT_TASK=${"${AGENT_TASK:-}"}"
            PROMPT="${"${PROMPT}"}

            $(cat /prompts/prompt.md)"

            echo "Starting ${"${AGENT_GIT_NAME:-Claude Agent}"}..."
            echo "Target repo: ${"${TARGET_REPO}"}"
            [ -n "${"${AGENT_TASK:-}"}" ] && echo "Task: ${"${AGENT_TASK}"}"
            echo "Model: ${"${ANTHROPIC_MODEL}"}"
            echo "Mode: sandbox (full Bash)"
            echo "---"

            # Standard Claude Code with full Bash access — the Sandbox provides isolation
            CLAUDE_ARGS="-p --dangerously-skip-permissions --verbose --output-format stream-json --model ${"${ANTHROPIC_MODEL}"}"

            # Session resume (opt-in via ENABLE_SESSION_RESUME=true)
            if [ "${"${ENABLE_SESSION_RESUME:-}"}" = "true" ]; then
              PREV_RUN_FLAG="/home/claude/.claude/.agent-ran"
              if [ -f "$PREV_RUN_FLAG" ]; then
                echo "Previous session found — resuming with --continue"
                CLAUDE_ARGS="$CLAUDE_ARGS --continue"
              else
                echo "First run — starting fresh session"
              fi
            fi

            RAW_LOG="/tmp/claude-raw-$(date +%s).jsonl"
            CLAUDE_EXIT=0

            timeout 3600 claude $CLAUDE_ARGS -- "$PROMPT" \
              | tee "$RAW_LOG" \
              | jq --unbuffered -r '
            if .type == "assistant" then
              .message.content[]? |
              if .type == "text" then ">>> " + .text[0:5000]
              elif .type == "tool_use" then "[" + .name + "] " + ((.input | tostring)[0:3000])
              else empty end
            elif .type == "result" then
              "[done] " + (.result // "complete")[0:5000]
            else empty end' || CLAUDE_EXIT=$?

            # Mark session for resume on next run
            if [ "${"${ENABLE_SESSION_RESUME:-}"}" = "true" ] && [ "$CLAUDE_EXIT" -eq 0 ]; then
              touch "/home/claude/.claude/.agent-ran"
            fi

            # If Claude timed out, salvage partial results
            if [ "$CLAUDE_EXIT" -eq 124 ]; then
              echo "=== TIMEOUT: Claude exceeded time limit ==="
              timeout 300 claude -p --dangerously-skip-permissions -- \
                "The previous process timed out. Check what partial results exist and write a summary to /tmp/partial-report.md."
            fi

            echo "=== Complete (exit: $CLAUDE_EXIT) ==="

          # --- Orchestrator entrypoint: creates a Runner, waits, streams logs, cleans up ---
          orchestrator-entrypoint.sh: |
            #!/bin/bash
            set -e
            RUNNER_NAME="${"${PARENT_NAME}"}-run-$(date +%s)"
            SANDBOX_NAME="${"${RUNNER_NAME}"}-sandbox"

            # Clean up any stale Runners from previous failed runs
            EXISTING=$(kubectl get claudecodeagentsandboxrunner -n ${"${NAMESPACE}"} -l orchestrator=${"${PARENT_NAME}"} -o name 2>/dev/null || true)
            if [ -n "${"${EXISTING}"}" ]; then
              echo "Cleaning up stale runners: ${"${EXISTING}"}"
              kubectl delete claudecodeagentsandboxrunner -n ${"${NAMESPACE}"} -l orchestrator=${"${PARENT_NAME}"} --timeout=60s || true
              sleep 5
            fi

            # Get parent CR UID for ownerReference (ensures GC on parent deletion)
            PARENT_UID=$(kubectl get claudecodeagentsandbox ${"${PARENT_NAME}"} -n ${"${NAMESPACE}"} -o jsonpath='{.metadata.uid}')

            echo "Creating Runner: ${"${RUNNER_NAME}"}"

            cat <<EOF | kubectl apply -f -
            apiVersion: kro.run/v1alpha1
            kind: ClaudeCodeAgentSandboxRunner
            metadata:
              name: ${"${RUNNER_NAME}"}
              namespace: ${"${NAMESPACE}"}
              labels:
                orchestrator: ${"${PARENT_NAME}"}
              ownerReferences:
                - apiVersion: kro.run/v1alpha1
                  kind: ClaudeCodeAgentSandbox
                  name: ${"${PARENT_NAME}"}
                  uid: ${"${PARENT_UID}"}
                  controller: false
                  blockOwnerDeletion: false
            spec:
              agentName: "${"${AGENT_GIT_NAME}"}"
              agentEmail: "${"${AGENT_GIT_EMAIL}"}"
              model: "${"${ANTHROPIC_MODEL}"}"
              repo: "${"${TARGET_REPO}"}"
              task: "${"${AGENT_TASK}"}"
              prompt: |
            $(sed 's/^/    /' /prompts/prompt.md)
              sessionResume: ${"${ENABLE_SESSION_RESUME:-false}"}
              workspacePvcName: "${"${WORKSPACE_PVC_NAME}"}"
              memoryPvcName: "${"${MEMORY_PVC_NAME}"}"
              configMapName: "${"${CONFIG_MAP_NAME}"}"
              credentials:
                secretName: "${"${CREDENTIALS_SECRET_NAME}"}"
            EOF

            # Wait for sandbox pod to be running before attaching logs
            echo "Waiting for sandbox ${"${SANDBOX_NAME}"} to start..."
            kubectl wait --for=condition=Ready sandbox/${"${SANDBOX_NAME}"} -n ${"${NAMESPACE}"} --timeout=120s || {
              echo "Sandbox failed to start, cleaning up..."
              kubectl delete claudecodeagentsandboxrunner ${"${RUNNER_NAME}"} -n ${"${NAMESPACE}"} --timeout=60s || true
              exit 1
            }

            # Stream logs in background (attached while pod is alive — captures everything)
            echo "=== Runner logs ==="
            kubectl logs -f ${"${SANDBOX_NAME}"} -c claude-code -n ${"${NAMESPACE}"} &
            LOGS_PID=$!

            # Wait for sandbox to finish
            kubectl wait --for=condition=Finished sandbox/${"${SANDBOX_NAME}"} -n ${"${NAMESPACE}"} --timeout=3600s || true

            # Wait for log stream to flush (exits when container terminates)
            wait ${"${LOGS_PID}"} 2>/dev/null || true

            # Cleanup
            echo "Cleaning up Runner: ${"${RUNNER_NAME}"}"
            kubectl delete claudecodeagentsandboxrunner ${"${RUNNER_NAME}"} -n ${"${NAMESPACE}"} --timeout=60s || true
            echo "=== Orchestrator complete ==="

          agent-prompt: ${schema.spec.prompt}

    # --- 2. PVC: workspace for cloned repos ---
    - id: workspacePvc
      template:
        apiVersion: v1
        kind: PersistentVolumeClaim
        metadata:
          name: ${schema.metadata.name}-workspace
          namespace: ${schema.metadata.namespace}
        spec:
          accessModes:
            - ReadWriteOnce
          resources:
            requests:
              storage: 5Gi

    # --- 3. PVC: Claude memory for session resume ---
    - id: memoryPvc
      template:
        apiVersion: v1
        kind: PersistentVolumeClaim
        metadata:
          name: ${schema.metadata.name}-memory
          namespace: ${schema.metadata.namespace}
        spec:
          accessModes:
            - ReadWriteOnce
          resources:
            requests:
              storage: 1Gi

    # --- 4. Standalone Runner: direct Sandbox execution (when no schedule) ---
    - id: standaloneRunner
      includeWhen:
        - ${schema.spec.schedule == ""}
      template:
        apiVersion: kro.run/v1alpha1
        kind: ClaudeCodeAgentSandboxRunner
        metadata:
          name: ${schema.metadata.name}
          namespace: ${schema.metadata.namespace}
        spec:
          agentName: ${schema.spec.agentName}
          agentEmail: ${schema.spec.agentEmail}
          model: ${schema.spec.model}
          repo: ${schema.spec.repo}
          task: ${schema.spec.task}
          prompt: ${schema.spec.prompt}
          sessionResume: ${schema.spec.sessionResume}
          workspacePvcName: ${workspacePvc.metadata.name}
          memoryPvcName: ${memoryPvc.metadata.name}
          configMapName: ${agentConfig.metadata.name}
          credentials:
            secretName: ${schema.spec.credentials.secretName}

    # --- 5. ServiceAccount for CronJob orchestrator (when schedule is set) ---
    - id: orchestratorSA
      includeWhen:
        - ${schema.spec.schedule != ""}
      template:
        apiVersion: v1
        kind: ServiceAccount
        metadata:
          name: ${schema.metadata.name}-orchestrator
          namespace: ${schema.metadata.namespace}

    # --- 6. Role: CRUD on Runners + read Sandboxes/Pods (when schedule is set) ---
    - id: orchestratorRole
      includeWhen:
        - ${schema.spec.schedule != ""}
      template:
        apiVersion: rbac.authorization.k8s.io/v1
        kind: Role
        metadata:
          name: ${schema.metadata.name}-orchestrator
          namespace: ${schema.metadata.namespace}
        rules:
          - apiGroups: ["kro.run"]
            resources: ["claudecodeagentsandboxes"]
            verbs: ["get"]
          - apiGroups: ["kro.run"]
            resources: ["claudecodeagentsandboxrunners"]
            verbs: ["create", "delete", "get", "list", "watch"]
          - apiGroups: ["agents.x-k8s.io"]
            resources: ["sandboxes"]
            verbs: ["get", "list", "watch"]
          - apiGroups: [""]
            resources: ["pods", "pods/log"]
            verbs: ["get", "list", "watch"]

    # --- 7. RoleBinding (when schedule is set) ---
    - id: orchestratorRoleBinding
      includeWhen:
        - ${schema.spec.schedule != ""}
      template:
        apiVersion: rbac.authorization.k8s.io/v1
        kind: RoleBinding
        metadata:
          name: ${schema.metadata.name}-orchestrator
          namespace: ${schema.metadata.namespace}
        subjects:
          - kind: ServiceAccount
            name: ${orchestratorSA.metadata.name}
            namespace: ${schema.metadata.namespace}
        roleRef:
          apiGroup: rbac.authorization.k8s.io
          kind: Role
          name: ${orchestratorRole.metadata.name}

    # --- 8. CronJob: orchestrator that creates Runners on schedule ---
    - id: agentCronJob
      includeWhen:
        - ${schema.spec.schedule != ""}
      template:
        apiVersion: batch/v1
        kind: CronJob
        metadata:
          name: ${schema.metadata.name}
          namespace: ${schema.metadata.namespace}
        spec:
          schedule: ${schema.spec.schedule}
          concurrencyPolicy: Forbid
          successfulJobsHistoryLimit: 3
          failedJobsHistoryLimit: 3
          jobTemplate:
            spec:
              backoffLimit: 0
              activeDeadlineSeconds: 3900
              template:
                spec:
                  restartPolicy: Never
                  serviceAccountName: ${orchestratorSA.metadata.name}
                  volumes:
                    - name: scripts
                      configMap:
                        name: ${agentConfig.metadata.name}
                        items:
                          - key: orchestrator-entrypoint.sh
                            path: entrypoint.sh
                            mode: 0755
                    - name: prompt
                      configMap:
                        name: ${agentConfig.metadata.name}
                        items:
                          - key: agent-prompt
                            path: prompt.md

                  containers:
                    - name: orchestrator
                      image: bitnami/kubectl:latest
                      imagePullPolicy: Never
                      command: ["/bin/bash", "/scripts/entrypoint.sh"]
                      env:
                        - name: PARENT_NAME
                          value: ${schema.metadata.name}
                        - name: NAMESPACE
                          value: ${schema.metadata.namespace}
                        - name: AGENT_GIT_NAME
                          value: ${schema.spec.agentName}
                        - name: AGENT_GIT_EMAIL
                          value: ${schema.spec.agentEmail}
                        - name: ANTHROPIC_MODEL
                          value: ${schema.spec.model}
                        - name: TARGET_REPO
                          value: ${schema.spec.repo}
                        - name: AGENT_TASK
                          value: ${schema.spec.task}
                        - name: ENABLE_SESSION_RESUME
                          value: '${schema.spec.sessionResume ? "true" : "false"}'
                        - name: WORKSPACE_PVC_NAME
                          value: ${workspacePvc.metadata.name}
                        - name: MEMORY_PVC_NAME
                          value: ${memoryPvc.metadata.name}
                        - name: CONFIG_MAP_NAME
                          value: ${agentConfig.metadata.name}
                        - name: CREDENTIALS_SECRET_NAME
                          value: ${schema.spec.credentials.secretName}
                      volumeMounts:
                        - name: scripts
                          mountPath: /scripts
                        - name: prompt
                          mountPath: /prompts
                      resources:
                        requests:
                          memory: "64Mi"
                          cpu: "50m"
                        limits:
                          memory: "128Mi"
                          cpu: "100m"
