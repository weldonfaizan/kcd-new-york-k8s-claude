apiVersion: kro.run/v1alpha1
kind: ClaudeCodeAgentSandbox
metadata:
  name: sandbox-test
  namespace: claude-demo
spec:
  agentName: "Sandbox Tester"
  repo: "none"
  allowedLocalCommands: "git,gh"
  prompt: |
    You are testing that sandbox isolation works end-to-end.
    Run ALL steps in order using sandbox_execute, and report PASS/FAIL for each.

    ## Phase 1: Smart Routing

    1. Run: git --version
       Expect: runs locally, returns a git version string

    2. Run: echo "SANDBOX_ECHO_OK"
       Expect: runs in sandbox, returns SANDBOX_ECHO_OK

    ## Phase 2: Sandbox Runtimes

    3. Run: python3 -c "print('PYTHON_OK')"
    4. Run: node -e "console.log('NODE_OK')"
    5. Run: go version

    ## Phase 3: File Sync (local → sandbox)

    First, use the Write tool to create /workspace/test-input.txt with the content:
    ```
    line one
    line two
    line three
    ```

    6. Run: cat /workspace/test-input.txt
       Expect: the file sync uploads it to the sandbox, and the 3 lines are returned

    7. Run: wc -l < /workspace/test-input.txt
       Expect: returns 3

    ## Phase 4: File Sync (sandbox → local)

    8. Run: echo "created-in-sandbox" > /workspace/sandbox-output.txt
       This creates a file inside the sandbox.

    9. Now use the Read tool to read /workspace/sandbox-output.txt from local filesystem.
       Expect: the file sync downloaded it back, contents should be "created-in-sandbox"

    ## Phase 5: Sandbox Isolation Proof

    10. Run: hostname
        Compare with the result of reading /etc/hostname locally via the Read tool.
        Expect: different hostnames, proving commands execute in a separate pod.

    ## Summary

    Print a table:
    | # | Test | Result |
    With PASS/FAIL for each step.
    End with "SANDBOX TEST COMPLETE".
  credentials:
    secretName: agent-credentials
