apiVersion: batch/v1
kind: Job
metadata:
  name: claude-reviewer
  namespace: 04-code-reviewer
spec:
  backoffLimit: 0
  template:
    spec:
      restartPolicy: Never
      volumes:
        - name: scripts
          configMap:
            name: reviewer-config
            items:
              - key: entrypoint.sh
                path: entrypoint.sh
                mode: 0755
        - name: prompt
          configMap:
            name: reviewer-config
            items:
              - key: agent-prompt
                path: prompt.md
        - name: workspace
          emptyDir: {}
        - name: proxy-certs
          emptyDir: {}

      # Native sidecar: starts before main containers, stops when they finish
      initContainers:
        - name: proxy-sidecar
          image: credential-proxy:latest
          imagePullPolicy: Never
          restartPolicy: Always   # This is what makes it a sidecar (K8s 1.29+)
          env:
            - name: ANTHROPIC_API_KEY
              valueFrom:
                secretKeyRef:
                  name: agent-credentials
                  key: ANTHROPIC_API_KEY
            - name: GH_TOKEN
              valueFrom:
                secretKeyRef:
                  name: agent-credentials
                  key: GH_TOKEN
          volumeMounts:
            - name: proxy-certs
              mountPath: /certs
          ports:
            - containerPort: 8080
              protocol: TCP
          startupProbe:
            exec:
              command: ["test", "-f", "/certs/proxy-ca.crt"]
            initialDelaySeconds: 1
            periodSeconds: 1
            failureThreshold: 10
          resources:
            requests:
              memory: "64Mi"
              cpu: "50m"
            limits:
              memory: "128Mi"
              cpu: "100m"

      containers:
        - name: claude-code
          image: claude-code:latest
          imagePullPolicy: Never
          command: ["/bin/bash", "/scripts/entrypoint.sh"]
          env:
            - name: ANTHROPIC_API_KEY
              value: "FAKE_KEY_REPLACED_BY_PROXY"
            - name: ANTHROPIC_BASE_URL
              value: "http://localhost:8080"
            - name: GH_TOKEN
              value: "FAKE_GH_TOKEN_REPLACED_BY_PROXY"
          envFrom:
            - configMapRef:
                name: reviewer-config
          volumeMounts:
            - name: scripts
              mountPath: /scripts
            - name: prompt
              mountPath: /prompts
            - name: workspace
              mountPath: /workspace
            - name: proxy-certs
              mountPath: /certs
              readOnly: true
          resources:
            requests:
              memory: "512Mi"
              cpu: "200m"
            limits:
              memory: "1Gi"
              cpu: "1000m"
