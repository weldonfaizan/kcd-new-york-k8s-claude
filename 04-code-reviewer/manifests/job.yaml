apiVersion: batch/v1
kind: Job
metadata:
  name: claude-reviewer
  namespace: 04-code-reviewer
spec:
  backoffLimit: 0
  template:
    spec:
      restartPolicy: Never
      volumes:
        - name: scripts
          configMap:
            name: reviewer-config
            items:
              - key: entrypoint.sh
                path: entrypoint.sh
                mode: 0755
        - name: prompt
          configMap:
            name: reviewer-config
            items:
              - key: agent-prompt
                path: prompt.md
        - name: workspace
          emptyDir: {}
        - name: proxy-certs
          emptyDir: {}
        - name: proxy-config
          configMap:
            name: proxy-config

      initContainers:
        # 1. iptables: redirect all egress TCP to the proxy
        # NOTE: PROXY_PORT must match the proxy-sidecar containerPort
        - name: iptables-init
          image: credential-proxy:latest
          imagePullPolicy: Never
          command: ["/bin/bash", "/app/iptables-init.sh"]
          securityContext:
            capabilities:
              add: ["NET_ADMIN"]
            runAsUser: 0
            runAsNonRoot: false
          env:
            - name: PROXY_PORT
              value: "15001"
            # Must match proxy-sidecar runAsUser
            - name: PROXY_UID
              value: "1337"
          resources:
            requests:
              memory: "32Mi"
              cpu: "10m"
            limits:
              memory: "64Mi"
              cpu: "50m"

        # 2. cert-init: generate ephemeral CA
        - name: cert-init
          image: credential-proxy:latest
          imagePullPolicy: Never
          command: ["/bin/bash", "/app/cert-init.sh"]
          securityContext:
            runAsUser: 0
            runAsNonRoot: false
          volumeMounts:
            - name: proxy-certs
              mountPath: /certs
          resources:
            requests:
              memory: "32Mi"
              cpu: "10m"
            limits:
              memory: "64Mi"
              cpu: "50m"

        # 3. Transparent proxy sidecar (runs for lifetime of pod)
        - name: proxy-sidecar
          image: credential-proxy:latest
          imagePullPolicy: Never
          restartPolicy: Always
          securityContext:
            runAsUser: 1337
          env:
            - name: PROXY_PORT
              value: "15001"
            - name: ANTHROPIC_API_KEY
              valueFrom:
                secretKeyRef:
                  name: agent-credentials
                  key: ANTHROPIC_API_KEY
                  optional: true
            - name: GH_TOKEN
              valueFrom:
                secretKeyRef:
                  name: agent-credentials
                  key: GH_TOKEN
          volumeMounts:
            - name: proxy-certs
              mountPath: /certs
            - name: proxy-config
              mountPath: /etc/proxy
          ports:
            - containerPort: 15001
              protocol: TCP
          startupProbe:
            exec:
              command: ["test", "-f", "/certs/proxy-ca.crt"]
            initialDelaySeconds: 1
            periodSeconds: 1
            failureThreshold: 10
          resources:
            requests:
              memory: "64Mi"
              cpu: "50m"
            limits:
              memory: "128Mi"
              cpu: "100m"

      containers:
        - name: claude-code
          image: claude-code:latest
          imagePullPolicy: Never
          command: ["/bin/bash", "/scripts/entrypoint.sh"]
          env:
            - name: CLAUDE_CODE_USE_BEDROCK
              value: "${CLAUDE_CODE_USE_BEDROCK}"
            - name: AWS_REGION
              value: "${AWS_REGION}"
            - name: ANTHROPIC_API_KEY
              value: "${ANTHROPIC_API_KEY_PLACEHOLDER}"
            - name: GH_TOKEN
              value: "FAKE_GH_TOKEN_REPLACED_BY_PROXY"
            - name: NODE_EXTRA_CA_CERTS
              value: "/certs/proxy-ca.crt"
            - name: SSL_CERT_FILE
              value: "/certs/combined-ca.crt"
          envFrom:
            - configMapRef:
                name: reviewer-config
          volumeMounts:
            - name: scripts
              mountPath: /scripts
            - name: prompt
              mountPath: /prompts
            - name: workspace
              mountPath: /workspace
            - name: proxy-certs
              mountPath: /certs
              readOnly: true
          resources:
            requests:
              memory: "512Mi"
              cpu: "200m"
            limits:
              memory: "1Gi"
              cpu: "1000m"
