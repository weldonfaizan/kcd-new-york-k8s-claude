apiVersion: v1
kind: ConfigMap
metadata:
  name: reviewer-config
  namespace: 04-code-reviewer
data:
  TARGET_REPO: "${TESTING_REPO}"
  ANTHROPIC_MODEL: "claude-haiku-4-5-20251001"
  AGENT_GIT_EMAIL: "claude-reviewer@bot.local"
  AGENT_GIT_NAME: "Claude Reviewer"

  # Generic entrypoint shared by all agents (04-reviewer, 05-developer)
  # Parameterized via env vars: AGENT_GIT_EMAIL, AGENT_GIT_NAME,
  # TARGET_REPO, FEATURE_REQUEST (optional), ENABLE_SESSION_RESUME (optional)
  entrypoint.sh: |
    #!/bin/bash
    set -e

    git config --global user.email "${AGENT_GIT_EMAIL:-claude-agent@bot.local}"
    git config --global user.name "${AGENT_GIT_NAME:-Claude Agent}"

    # Route only git and gh through the credential proxy (not all HTTPS traffic)
    if [ -f /certs/combined-ca.crt ]; then
      git config --global http.proxy http://127.0.0.1:8080
      git config --global http.sslCAInfo /certs/combined-ca.crt
      mkdir -p "$HOME/bin"
      cat > "$HOME/bin/gh" << 'GHWRAPPER'
    #!/bin/bash
    exec env HTTPS_PROXY=http://127.0.0.1:8080 SSL_CERT_FILE=/certs/combined-ca.crt /usr/bin/gh "$@"
    GHWRAPPER
      chmod +x "$HOME/bin/gh"
      export PATH="$HOME/bin:$PATH"
    fi

    # Build prompt: inject env vars as context, then append the prompt file
    PROMPT="TARGET_REPO=${TARGET_REPO}"
    [ -n "${AGENT_TASK:-}" ] && PROMPT="${PROMPT}
    AGENT_TASK=${AGENT_TASK:-}"
    PROMPT="${PROMPT}

    $(cat /prompts/prompt.md)"

    echo "Starting ${AGENT_GIT_NAME:-Claude Agent}..."
    echo "Target repo: ${TARGET_REPO}"
    [ -n "${AGENT_TASK:-}" ] && echo "Task: ${AGENT_TASK}"
    echo "Model: ${ANTHROPIC_MODEL}"
    echo "---"

    # Run Claude Code with stream-json output, filtered through jq for readable logs
    CLAUDE_ARGS="-p --dangerously-skip-permissions --verbose --output-format stream-json --model ${ANTHROPIC_MODEL}"

    # Session resume (opt-in via ENABLE_SESSION_RESUME=true)
    if [ "${ENABLE_SESSION_RESUME:-}" = "true" ]; then
      PREV_RUN_FLAG="/home/claude/.claude/.agent-ran"
      if [ -f "$PREV_RUN_FLAG" ]; then
        echo "Previous session found — resuming with --continue"
        CLAUDE_ARGS="$CLAUDE_ARGS --continue"
      else
        echo "First run — starting fresh session"
      fi
    fi

    RAW_LOG="/tmp/claude-raw-$(date +%s).jsonl"
    CLAUDE_EXIT=0

    timeout 3600 claude $CLAUDE_ARGS -- "$PROMPT" \
      | tee "$RAW_LOG" \
      | jq --unbuffered -r '
    if .type == "assistant" then
      .message.content[]? |
      if .type == "text" then ">>> " + .text[0:5000]
      elif .type == "tool_use" then "[" + .name + "] " + ((.input | tostring)[0:3000])
      else empty end
    elif .type == "result" then
      "[done] " + (.result // "complete")[0:5000]
    else empty end' || CLAUDE_EXIT=$?

    # Mark session for resume on next run
    if [ "${ENABLE_SESSION_RESUME:-}" = "true" ] && [ "$CLAUDE_EXIT" -eq 0 ]; then
      touch "/home/claude/.claude/.agent-ran"
    fi

    # If Claude timed out, salvage partial results
    if [ "$CLAUDE_EXIT" -eq 124 ]; then
      echo "=== TIMEOUT: Claude exceeded time limit ==="
      timeout 300 claude -p --dangerously-skip-permissions -- \
        "The previous process timed out. Check what partial results exist and write a summary to /tmp/partial-report.md."
    fi

    echo "=== Complete (exit: $CLAUDE_EXIT) ==="

  # Prompt mounted into the container at /prompts/prompt.md
  agent-prompt: |
    You are an autonomous code review agent for the GitHub repository specified in TARGET_REPO.

    ## Setup

    Clone the repository if not already present, then fetch latest:
    ```bash
    cd /workspace
    if [ ! -d "repo" ]; then
      gh repo clone "$TARGET_REPO" repo
    fi
    cd repo
    git fetch --all
    ```

    ## Review Process

    1. List all open PRs:
       ```bash
       gh pr list --state open --json number,title,headRefName,author
       ```

    2. For each open PR, check if it was already approved by looking for a comment containing
       BOTH `<!-- claude-reviewer -->` AND the word "Approved":
       ```bash
       gh pr view <number> --comments --json comments
       ```
       Skip the PR only if you already left an approval comment (contains "Approved").
       If you left a "Changes Requested" comment, you must review it again to check if the issues were fixed.

    3. For unreviewed PRs, fetch the full diff and all changed files:
       ```bash
       gh pr diff <number>
       gh pr view <number> --json files,title,body
       ```

    ## Review Criteria

    Evaluate each PR for:
    - **Tests**: Every new endpoint or function MUST have a corresponding test. If tests are missing, you MUST request changes — do not approve or merge.
    - **Security**: No hardcoded secrets, no injection vulnerabilities
    - **Correctness**: Logic errors, edge cases, error handling
    - **Style**: Consistent with the rest of the codebase (check CLAUDE.md in the repo for conventions)

    ## Decision Logic

    **If tests are missing for new/changed functionality** — request changes:
    ```bash
    gh pr review <number> --request-changes --body "<!-- claude-reviewer -->
    ## Code Review: Changes Requested

    The implementation looks correct, but this PR is missing tests.

    Per the project's CLAUDE.md, every new endpoint must have a corresponding test in \`test/app.test.js\` using Node's built-in \`node:test\` runner.

    Please add tests that cover:
    - Happy path (valid input)
    - Edge cases (missing fields, invalid input)

    Once tests are added, I'll re-review and approve."
    ```

    **If code looks good AND tests are present** — leave an approval comment and merge:
    ```bash
    gh pr comment <number> --body "<!-- claude-reviewer -->
    ## Code Review: Approved

    Looks great! Implementation is correct, tests are present and cover the new functionality. Merging."
    gh pr merge <number> --merge --delete-branch
    ```
    Note: use `gh pr comment` + `gh pr merge` (not `gh pr review --approve`) since the reviewer
    and author share the same GitHub token and GitHub blocks self-approval.

    ## Exit Summary

    Print a summary:
    - Total open PRs found
    - PRs skipped (already reviewed)
    - PRs reviewed: list each with action taken (changes requested / approved+merged)
