# ClaudeCodeSandboxTemplate — the infrastructure layer
# Creates a SandboxTemplate (long-running agent server + proxy sidecar)
# and a SandboxWarmPool of N pre-warmed pods ready to accept work.
# Managed NetworkPolicy is enabled by default (secure-by-default).
apiVersion: kro.run/v1alpha1
kind: ResourceGraphDefinition
metadata:
  name: claudecodesandboxtemplate
  annotations:
    kro.run/allow-breaking-changes: "true"
spec:
  schema:
    apiVersion: v1alpha1
    kind: ClaudeCodeSandboxTemplate

    types:
      Domain:
        host: string | required=true
        port: integer | default=443
        action: 'string | default="credential-replace"'
        inject_header: string | default=""
        inject_auth: string | default=""
        credential_env: string | default=""

    spec:
      replicas: integer | default=1 description="Number of pre-warmed sandboxes in the pool"
      model: string | default="claude-haiku-4-5-20251001" description="Default Claude model"
      authMode: 'string | default="bedrock" description="Auth mode: bedrock or api-key"'
      credentials:
        secretName: string | required=true description="Secret containing GH_TOKEN (and ANTHROPIC_API_KEY if api-key mode)"
      proxy:
        mode: 'string | default="strict" description="Proxy mode: strict, allow-everything, or block-unknown"'
        domains: "[]Domain"

    status:
      templateName: ${sandboxTemplate.metadata.name}
      warmPoolName: ${warmPool.metadata.name}
      ready: ${warmPool.status.readyReplicas}

  resources:

    # --- 1. ConfigMap: proxy configuration ---
    - id: proxyConfig
      template:
        apiVersion: v1
        kind: ConfigMap
        metadata:
          name: ${schema.metadata.name}-proxy-config
          namespace: ${schema.metadata.namespace}
        data:
          config.yaml: |-
            mode: ${schema.spec.proxy.mode}
            domains: ${json.marshal(schema.spec.proxy.domains)}

    # --- 2. ConfigMap: sandbox runtime server (standard SDK-compatible API) ---
    - id: serverConfig
      template:
        apiVersion: v1
        kind: ConfigMap
        metadata:
          name: ${schema.metadata.name}-server
          namespace: ${schema.metadata.namespace}
        data:
          server.py: |
            #!/usr/bin/env python3
            """Standard sandbox runtime: /execute, /upload, /download, /list, /exists.
            Compatible with the k8s-agent-sandbox Python SDK (sandbox.commands.run())."""
            import os, subprocess, shlex, logging, urllib.parse
            from fastapi import FastAPI, UploadFile, File
            from fastapi.responses import FileResponse, JSONResponse
            from pydantic import BaseModel

            WORKDIR = "/workspace"

            class ExecuteRequest(BaseModel):
                command: str
                timeout: int = 3600

            class ExecuteResponse(BaseModel):
                stdout: str
                stderr: str
                exit_code: int

            def get_safe_path(file_path: str) -> str:
                base_dir = os.path.realpath(WORKDIR)
                clean_path = file_path.lstrip("/")
                full_path = os.path.realpath(os.path.join(base_dir, clean_path))
                if os.path.commonpath([base_dir, full_path]) != base_dir:
                    raise ValueError("Access denied")
                return full_path

            app = FastAPI()

            @app.get("/")
            async def health():
                return {"status": "ok"}

            @app.post("/execute", response_model=ExecuteResponse)
            async def execute(request: ExecuteRequest):
                try:
                    process = subprocess.run(
                        ["bash", "-c", request.command],
                        capture_output=True, text=True,
                        cwd=WORKDIR, timeout=request.timeout,
                        env=os.environ.copy(),
                    )
                    return ExecuteResponse(
                        stdout=process.stdout,
                        stderr=process.stderr,
                        exit_code=process.returncode,
                    )
                except subprocess.TimeoutExpired:
                    return ExecuteResponse(stdout="", stderr="Command timed out", exit_code=124)
                except Exception as e:
                    return ExecuteResponse(stdout="", stderr=str(e), exit_code=1)

            @app.post("/upload")
            async def upload(file: UploadFile = File(...)):
                path = os.path.join(WORKDIR, file.filename)
                os.makedirs(os.path.dirname(path), exist_ok=True)
                with open(path, "wb") as f:
                    f.write(await file.read())
                return {"message": f"Uploaded {file.filename}"}

            @app.get("/download/{path:path}")
            async def download(path: str):
                decoded = urllib.parse.unquote(path)
                try:
                    full = get_safe_path(decoded)
                except ValueError:
                    return JSONResponse(status_code=403, content={"message": "Access denied"})
                if os.path.isfile(full):
                    return FileResponse(full)
                return JSONResponse(status_code=404, content={"message": "Not found"})

            @app.get("/list/{path:path}")
            async def list_files(path: str):
                decoded = urllib.parse.unquote(path)
                try:
                    full = get_safe_path(decoded)
                except ValueError:
                    return JSONResponse(status_code=403, content={"message": "Access denied"})
                if not os.path.isdir(full):
                    return JSONResponse(status_code=404, content={"message": "Not a directory"})
                entries = []
                for entry in os.scandir(full):
                    s = entry.stat()
                    entries.append({"name": entry.name, "size": s.st_size,
                                    "type": "directory" if entry.is_dir() else "file",
                                    "mod_time": s.st_mtime})
                return entries

            @app.get("/exists/{path:path}")
            async def exists(path: str):
                decoded = urllib.parse.unquote(path)
                try:
                    full = get_safe_path(decoded)
                except ValueError:
                    return JSONResponse(status_code=403, content={"message": "Access denied"})
                return {"path": decoded, "exists": os.path.exists(full)}

            if __name__ == "__main__":
                import uvicorn
                port = int(os.environ.get("SERVER_PORT", "8888"))
                # Trust proxy CA for git
                if os.path.exists("/certs/combined-ca.crt"):
                    subprocess.run(["git", "config", "--global", "http.sslCAInfo", "/certs/combined-ca.crt"], capture_output=True)
                print(f"Sandbox runtime starting on port {port}...")
                uvicorn.run(app, host="0.0.0.0", port=port)

    # --- 3. SandboxTemplate: long-running agent server + proxy ---
    - id: sandboxTemplate
      template:
        apiVersion: extensions.agents.x-k8s.io/v1alpha1
        kind: SandboxTemplate
        metadata:
          name: ${schema.metadata.name}
          namespace: ${schema.metadata.namespace}
        spec:
          networkPolicyManagement: Managed
          networkPolicy:
            ingress:
              - from:
                - podSelector:
                    matchLabels:
                      app: sandbox-dispatcher
            egress:
              - to:
                - ipBlock:
                    cidr: 0.0.0.0/0
                    except:
                      - 169.254.0.0/16
                - ipBlock:
                    cidr: "::/0"
                    except:
                      - "fc00::/7"
          envVarsInjectionPolicy: Disallowed
          service: true
          volumeClaimTemplates:
            - metadata:
                name: workspace
              spec:
                accessModes: [ReadWriteOnce]
                resources:
                  requests:
                    storage: 5Gi
          podTemplate:
            spec:
              restartPolicy: OnFailure
              volumes:
                - name: server-script
                  configMap:
                    name: ${serverConfig.metadata.name}
                    items:
                      - key: server.py
                        path: server.py
                - name: proxy-certs
                  emptyDir: {}
                - name: proxy-config
                  configMap:
                    name: ${proxyConfig.metadata.name}

              initContainers:
                - name: iptables-init
                  image: credential-proxy:latest
                  imagePullPolicy: Never
                  command: ["/bin/bash", "/app/iptables-init.sh"]
                  securityContext:
                    capabilities:
                      add: ["NET_ADMIN"]
                    runAsUser: 0
                    runAsNonRoot: false
                  env:
                    - name: PROXY_PORT
                      value: "15001"
                    - name: PROXY_UID
                      value: "1337"
                  resources:
                    requests:
                      memory: "32Mi"
                      cpu: "10m"
                    limits:
                      memory: "64Mi"
                      cpu: "50m"

                - name: cert-init
                  image: credential-proxy:latest
                  imagePullPolicy: Never
                  command: ["/bin/bash", "/app/cert-init.sh"]
                  securityContext:
                    runAsUser: 0
                    runAsNonRoot: false
                  volumeMounts:
                    - name: proxy-certs
                      mountPath: /certs
                  resources:
                    requests:
                      memory: "32Mi"
                      cpu: "10m"
                    limits:
                      memory: "64Mi"
                      cpu: "50m"

                - name: proxy-sidecar
                  image: credential-proxy:latest
                  imagePullPolicy: Never
                  restartPolicy: Always
                  securityContext:
                    runAsUser: 1337
                  env:
                    - name: PROXY_PORT
                      value: "15001"
                    - name: ANTHROPIC_API_KEY
                      valueFrom:
                        secretKeyRef:
                          name: ${schema.spec.credentials.secretName}
                          key: ANTHROPIC_API_KEY
                          optional: true
                    - name: GH_TOKEN
                      valueFrom:
                        secretKeyRef:
                          name: ${schema.spec.credentials.secretName}
                          key: GH_TOKEN
                  volumeMounts:
                    - name: proxy-certs
                      mountPath: /certs
                    - name: proxy-config
                      mountPath: /etc/proxy
                  ports:
                    - containerPort: 15001
                      protocol: TCP
                  startupProbe:
                    exec:
                      command: ["test", "-f", "/certs/proxy-ca.crt"]
                    initialDelaySeconds: 1
                    periodSeconds: 1
                    failureThreshold: 10
                  resources:
                    requests:
                      memory: "64Mi"
                      cpu: "50m"
                    limits:
                      memory: "128Mi"
                      cpu: "100m"

              containers:
                - name: claude-code
                  image: claude-code:latest
                  imagePullPolicy: Never
                  command: ["/opt/venv/bin/python3", "/server/server.py"]
                  env:
                    - name: CLAUDE_CODE_USE_BEDROCK
                      value: '${schema.spec.authMode == "bedrock" ? "1" : ""}'
                    - name: AWS_REGION
                      value: '${schema.spec.authMode == "bedrock" ? "us-west-2" : ""}'
                    - name: ANTHROPIC_API_KEY
                      value: '${schema.spec.authMode == "api-key" ? "FAKE_KEY_REPLACED_BY_PROXY" : ""}'
                    - name: GH_TOKEN
                      value: "FAKE_GH_TOKEN_REPLACED_BY_PROXY"
                    - name: NODE_EXTRA_CA_CERTS
                      value: "/certs/proxy-ca.crt"
                    - name: SSL_CERT_FILE
                      value: "/certs/combined-ca.crt"
                    - name: ANTHROPIC_MODEL
                      value: ${schema.spec.model}
                    - name: SERVER_PORT
                      value: "8888"
                  ports:
                    - containerPort: 8888
                      protocol: TCP
                  readinessProbe:
                    httpGet:
                      path: /
                      port: 8888
                    initialDelaySeconds: 2
                    periodSeconds: 5
                  livenessProbe:
                    httpGet:
                      path: /
                      port: 8888
                    initialDelaySeconds: 5
                    periodSeconds: 30
                  volumeMounts:
                    - name: workspace
                      mountPath: /workspace
                    - name: server-script
                      mountPath: /server
                    - name: proxy-certs
                      mountPath: /certs
                      readOnly: true
                  resources:
                    requests:
                      memory: "512Mi"
                      cpu: "200m"
                    limits:
                      memory: "1Gi"
                      cpu: "1000m"

    # --- 4. SandboxWarmPool: pre-warmed pods running the agent server ---
    - id: warmPool
      template:
        apiVersion: extensions.agents.x-k8s.io/v1alpha1
        kind: SandboxWarmPool
        metadata:
          name: ${schema.metadata.name}-pool
          namespace: ${schema.metadata.namespace}
        spec:
          replicas: ${schema.spec.replicas}
          sandboxTemplateRef:
            name: ${sandboxTemplate.metadata.name}
          updateStrategy:
            type: Recreate
