apiVersion: kro.run/v1alpha1
kind: ResourceGraphDefinition
metadata:
  name: claudecodeagent
  annotations:
    kro.run/allow-breaking-changes: "true"
spec:
  schema:
    apiVersion: v1alpha1
    kind: ClaudeCodeAgent

    types:
      Domain:
        host: string | required=true
        port: integer | default=443
        action: 'string | default="credential-replace"'
        inject_header: string | default=""
        inject_auth: string | default=""
        credential_env: string | default=""

    spec:
      agentName: string | required=true description="Display name for the agent (used in git commits)"
      agentEmail: string | default="claude-agent@bot.local" description="Git email for the agent"
      model: string | default="claude-haiku-4-5-20251001" description="Claude model to use"
      logFormat: 'string | default="text" description="Log output format: text or json"'
      repo: string | required=true description="GitHub repository (owner/repo)"
      task: string | default="" description="Optional task description passed as AGENT_TASK env var"
      prompt: string | required=true description="Full agent prompt (mounted at /prompts/prompt.md)"
      schedule: string | default="" description="Cron schedule (empty = one-shot Job, cron = CronJob)"
      sessionResume: boolean | default=false description="Enable session resume across runs"
      credentials:
        secretName: string | required=true description="Name of the Secret containing ANTHROPIC_API_KEY and GH_TOKEN"
      proxy:
        mode: 'string | default="strict" description="Proxy mode: strict, allow-everything, or block-unknown"'
        domains: "[]Domain"

    status:
      configMapName: ${agentConfig.metadata.name}
      proxyConfigName: ${proxyConfig.metadata.name}
      workspacePvcName: ${workspacePvc.metadata.name}
      memoryPvcName: ${memoryPvc.metadata.name}

  resources:

    # --- 1. ConfigMap: proxy configuration (allowlist + cert validity) ---
    - id: proxyConfig
      template:
        apiVersion: v1
        kind: ConfigMap
        metadata:
          name: ${schema.metadata.name}-proxy-config
          namespace: ${schema.metadata.namespace}
        data:
          config.yaml: |-
            mode: ${schema.spec.proxy.mode}
            domains: ${json.marshal(schema.spec.proxy.domains)}

    # --- 2. ConfigMap: agent configuration, entrypoint script, and prompt ---
    - id: agentConfig
      template:
        apiVersion: v1
        kind: ConfigMap
        metadata:
          name: ${schema.metadata.name}-config
          namespace: ${schema.metadata.namespace}
        data:
          TARGET_REPO: ${schema.spec.repo}
          ANTHROPIC_MODEL: ${schema.spec.model}
          LOG_FORMAT: ${schema.spec.logFormat}
          AGENT_GIT_EMAIL: ${schema.spec.agentEmail}
          AGENT_GIT_NAME: ${schema.spec.agentName}
          ENABLE_SESSION_RESUME: '${schema.spec.sessionResume ? "true" : ""}'
          AGENT_TASK: ${schema.spec.task}

          entrypoint.sh: |
            #!/bin/bash
            set -e

            git config --global user.email "${"${AGENT_GIT_EMAIL:-claude-agent@bot.local}"}"
            git config --global user.name "${"${AGENT_GIT_NAME:-Claude Agent}"}"

            # Trust the proxy CA for MITM'd TLS connections
            if [ -f /certs/combined-ca.crt ]; then
              git config --global http.sslCAInfo /certs/combined-ca.crt
            fi

            # Build prompt: inject env vars as context, then append the prompt file
            PROMPT="TARGET_REPO=${"${TARGET_REPO}"}"
            [ -n "${"${AGENT_TASK:-}"}" ] && PROMPT="${"${PROMPT}"}
            AGENT_TASK=${"${AGENT_TASK:-}"}"
            PROMPT="${"${PROMPT}"}

            $(cat /prompts/prompt.md)"

            echo "Starting ${"${AGENT_GIT_NAME:-Claude Agent}"}..."
            echo "Target repo: ${"${TARGET_REPO}"}"
            [ -n "${"${AGENT_TASK:-}"}" ] && echo "Task: ${"${AGENT_TASK}"}"
            echo "Model: ${"${ANTHROPIC_MODEL}"}"
            echo "---"

            # Run Claude Code with stream-json output, filtered through jq for readable logs
            CLAUDE_ARGS="-p --dangerously-skip-permissions --verbose --output-format stream-json --model ${"${ANTHROPIC_MODEL}"}"

            # Session resume (opt-in via ENABLE_SESSION_RESUME=true)
            if [ "${"${ENABLE_SESSION_RESUME:-}"}" = "true" ]; then
              PREV_RUN_FLAG="/home/claude/.claude/.agent-ran"
              if [ -f "$PREV_RUN_FLAG" ]; then
                echo "Previous session found — resuming with --continue"
                CLAUDE_ARGS="$CLAUDE_ARGS --continue"
              else
                echo "First run — starting fresh session"
              fi
            fi

            RAW_LOG="/tmp/claude-raw-$(date +%s).jsonl"
            CLAUDE_EXIT=0

            if [ "${"${LOG_FORMAT:-text}"}" = "json" ]; then
              timeout 3600 claude $CLAUDE_ARGS -- "$PROMPT" \
                | tee "$RAW_LOG" || CLAUDE_EXIT=$?
            else
              timeout 3600 claude $CLAUDE_ARGS -- "$PROMPT" \
                | tee "$RAW_LOG" \
                | jq --unbuffered -r '
              if .type == "assistant" then
                .message.content[]? |
                if .type == "text" then ">>> " + .text[0:5000]
                elif .type == "tool_use" then "[" + .name + "] " + ((.input | tostring)[0:3000])
                else empty end
              elif .type == "result" then
                "[done] " + (.result // "complete")[0:5000]
              else empty end' || CLAUDE_EXIT=$?
            fi

            # Mark session for resume on next run
            if [ "${"${ENABLE_SESSION_RESUME:-}"}" = "true" ] && [ "$CLAUDE_EXIT" -eq 0 ]; then
              touch "/home/claude/.claude/.agent-ran"
            fi

            # If Claude timed out, salvage partial results
            if [ "$CLAUDE_EXIT" -eq 124 ]; then
              echo "=== TIMEOUT: Claude exceeded time limit ==="
              timeout 300 claude -p --dangerously-skip-permissions -- \
                "The previous process timed out. Check what partial results exist and write a summary to /tmp/partial-report.md."
            fi

            echo "=== Complete (exit: $CLAUDE_EXIT) ==="

          agent-prompt: ${schema.spec.prompt}

    # --- 2. PVC: workspace for cloned repos ---
    - id: workspacePvc
      template:
        apiVersion: v1
        kind: PersistentVolumeClaim
        metadata:
          name: ${schema.metadata.name}-workspace
          namespace: ${schema.metadata.namespace}
        spec:
          accessModes:
            - ReadWriteOnce
          resources:
            requests:
              storage: 5Gi

    # --- 3. PVC: Claude memory for session resume ---
    - id: memoryPvc
      template:
        apiVersion: v1
        kind: PersistentVolumeClaim
        metadata:
          name: ${schema.metadata.name}-memory
          namespace: ${schema.metadata.namespace}
        spec:
          accessModes:
            - ReadWriteOnce
          resources:
            requests:
              storage: 1Gi

    # --- 4. Job: one-shot agent (when schedule is empty) ---
    - id: agentJob
      includeWhen:
        - ${schema.spec.schedule == ""}
      template:
        apiVersion: batch/v1
        kind: Job
        metadata:
          name: ${schema.metadata.name}
          namespace: ${schema.metadata.namespace}
        spec:
          backoffLimit: 0
          activeDeadlineSeconds: 3600
          template:
            spec:
              restartPolicy: Never
              volumes:
                - name: scripts
                  configMap:
                    name: ${agentConfig.metadata.name}
                    items:
                      - key: entrypoint.sh
                        path: entrypoint.sh
                        mode: 0755
                - name: prompt
                  configMap:
                    name: ${agentConfig.metadata.name}
                    items:
                      - key: agent-prompt
                        path: prompt.md
                - name: workspace
                  persistentVolumeClaim:
                    claimName: ${workspacePvc.metadata.name}
                - name: claude-memory
                  persistentVolumeClaim:
                    claimName: ${memoryPvc.metadata.name}
                - name: proxy-certs
                  emptyDir: {}
                - name: proxy-config
                  configMap:
                    name: ${proxyConfig.metadata.name}

              initContainers:
                # NOTE: PROXY_PORT must match the proxy-sidecar containerPort
                - name: iptables-init
                  image: credential-proxy:latest
                  imagePullPolicy: Never
                  command: ["/bin/bash", "/app/iptables-init.sh"]
                  securityContext:
                    capabilities:
                      add: ["NET_ADMIN"]
                    runAsUser: 0
                    runAsNonRoot: false
                  env:
                    - name: PROXY_PORT
                      value: "15001"
                    # Must match proxy-sidecar runAsUser
                    - name: PROXY_UID
                      value: "1337"
                  resources:
                    requests:
                      memory: "32Mi"
                      cpu: "10m"
                    limits:
                      memory: "64Mi"
                      cpu: "50m"

                - name: cert-init
                  image: credential-proxy:latest
                  imagePullPolicy: Never
                  command: ["/bin/bash", "/app/cert-init.sh"]
                  securityContext:
                    runAsUser: 0
                    runAsNonRoot: false
                  volumeMounts:
                    - name: proxy-certs
                      mountPath: /certs
                  resources:
                    requests:
                      memory: "32Mi"
                      cpu: "10m"
                    limits:
                      memory: "64Mi"
                      cpu: "50m"

                - name: proxy-sidecar
                  image: credential-proxy:latest
                  imagePullPolicy: Never
                  restartPolicy: Always
                  securityContext:
                    runAsUser: 1337
                  env:
                    - name: PROXY_PORT
                      value: "15001"
                    - name: ANTHROPIC_API_KEY
                      valueFrom:
                        secretKeyRef:
                          name: ${schema.spec.credentials.secretName}
                          key: ANTHROPIC_API_KEY
                    - name: GH_TOKEN
                      valueFrom:
                        secretKeyRef:
                          name: ${schema.spec.credentials.secretName}
                          key: GH_TOKEN
                  volumeMounts:
                    - name: proxy-certs
                      mountPath: /certs
                    - name: proxy-config
                      mountPath: /etc/proxy
                  ports:
                    - containerPort: 15001
                      protocol: TCP
                  startupProbe:
                    exec:
                      command: ["test", "-f", "/certs/proxy-ca.crt"]
                    initialDelaySeconds: 1
                    periodSeconds: 1
                    failureThreshold: 10
                  resources:
                    requests:
                      memory: "64Mi"
                      cpu: "50m"
                    limits:
                      memory: "128Mi"
                      cpu: "100m"

              containers:
                - name: claude-code
                  image: claude-code:latest
                  imagePullPolicy: Never
                  command: ["/bin/bash", "/scripts/entrypoint.sh"]
                  env:
                    - name: ANTHROPIC_API_KEY
                      value: "FAKE_KEY_REPLACED_BY_PROXY"
                    - name: GH_TOKEN
                      value: "FAKE_GH_TOKEN_REPLACED_BY_PROXY"
                    - name: NODE_EXTRA_CA_CERTS
                      value: "/certs/proxy-ca.crt"
                    - name: SSL_CERT_FILE
                      value: "/certs/combined-ca.crt"
                  envFrom:
                    - configMapRef:
                        name: ${agentConfig.metadata.name}
                  volumeMounts:
                    - name: workspace
                      mountPath: /workspace
                    - name: claude-memory
                      mountPath: /home/claude/.claude
                    - name: scripts
                      mountPath: /scripts
                    - name: prompt
                      mountPath: /prompts
                    - name: proxy-certs
                      mountPath: /certs
                      readOnly: true
                  resources:
                    requests:
                      memory: "512Mi"
                      cpu: "200m"
                    limits:
                      memory: "1Gi"
                      cpu: "1000m"

    # --- 5. CronJob: recurring agent (when schedule is set) ---
    - id: agentCronJob
      includeWhen:
        - ${schema.spec.schedule != ""}
      template:
        apiVersion: batch/v1
        kind: CronJob
        metadata:
          name: ${schema.metadata.name}
          namespace: ${schema.metadata.namespace}
        spec:
          schedule: ${schema.spec.schedule}
          concurrencyPolicy: Forbid
          successfulJobsHistoryLimit: 3
          failedJobsHistoryLimit: 3
          jobTemplate:
            spec:
              backoffLimit: 0
              template:
                spec:
                  restartPolicy: Never
                  volumes:
                    - name: scripts
                      configMap:
                        name: ${agentConfig.metadata.name}
                        items:
                          - key: entrypoint.sh
                            path: entrypoint.sh
                            mode: 0755
                    - name: prompt
                      configMap:
                        name: ${agentConfig.metadata.name}
                        items:
                          - key: agent-prompt
                            path: prompt.md
                    - name: workspace
                      persistentVolumeClaim:
                        claimName: ${workspacePvc.metadata.name}
                    - name: claude-memory
                      persistentVolumeClaim:
                        claimName: ${memoryPvc.metadata.name}
                    - name: proxy-certs
                      emptyDir: {}
                    - name: proxy-config
                      configMap:
                        name: ${proxyConfig.metadata.name}

                  initContainers:
                    # NOTE: PROXY_PORT must match the proxy-sidecar containerPort
                    - name: iptables-init
                      image: credential-proxy:latest
                      imagePullPolicy: Never
                      command: ["/bin/bash", "/app/iptables-init.sh"]
                      securityContext:
                        capabilities:
                          add: ["NET_ADMIN"]
                        runAsUser: 0
                        runAsNonRoot: false
                      env:
                        - name: PROXY_PORT
                          value: "15001"
                        # Must match proxy-sidecar runAsUser
                        - name: PROXY_UID
                          value: "1337"
                      resources:
                        requests:
                          memory: "32Mi"
                          cpu: "10m"
                        limits:
                          memory: "64Mi"
                          cpu: "50m"

                    - name: cert-init
                      image: credential-proxy:latest
                      imagePullPolicy: Never
                      command: ["/bin/bash", "/app/cert-init.sh"]
                      securityContext:
                        runAsUser: 0
                        runAsNonRoot: false
                      volumeMounts:
                        - name: proxy-certs
                          mountPath: /certs
                      resources:
                        requests:
                          memory: "32Mi"
                          cpu: "10m"
                        limits:
                          memory: "64Mi"
                          cpu: "50m"

                    - name: proxy-sidecar
                      image: credential-proxy:latest
                      imagePullPolicy: Never
                      restartPolicy: Always
                      securityContext:
                        runAsUser: 1337
                      env:
                        - name: PROXY_PORT
                          value: "15001"
                        - name: ANTHROPIC_API_KEY
                          valueFrom:
                            secretKeyRef:
                              name: ${schema.spec.credentials.secretName}
                              key: ANTHROPIC_API_KEY
                        - name: GH_TOKEN
                          valueFrom:
                            secretKeyRef:
                              name: ${schema.spec.credentials.secretName}
                              key: GH_TOKEN
                      volumeMounts:
                        - name: proxy-certs
                          mountPath: /certs
                        - name: proxy-config
                          mountPath: /etc/proxy
                      ports:
                        - containerPort: 15001
                          protocol: TCP
                      startupProbe:
                        exec:
                          command: ["test", "-f", "/certs/proxy-ca.crt"]
                        initialDelaySeconds: 1
                        periodSeconds: 1
                        failureThreshold: 10
                      resources:
                        requests:
                          memory: "64Mi"
                          cpu: "50m"
                        limits:
                          memory: "128Mi"
                          cpu: "100m"

                  containers:
                    - name: claude-code
                      image: claude-code:latest
                      imagePullPolicy: Never
                      command: ["/bin/bash", "/scripts/entrypoint.sh"]
                      env:
                        - name: ANTHROPIC_API_KEY
                          value: "FAKE_KEY_REPLACED_BY_PROXY"
                        - name: GH_TOKEN
                          value: "FAKE_GH_TOKEN_REPLACED_BY_PROXY"
                        - name: NODE_EXTRA_CA_CERTS
                          value: "/certs/proxy-ca.crt"
                        - name: SSL_CERT_FILE
                          value: "/certs/combined-ca.crt"
                      envFrom:
                        - configMapRef:
                            name: ${agentConfig.metadata.name}
                      volumeMounts:
                        - name: workspace
                          mountPath: /workspace
                        - name: claude-memory
                          mountPath: /home/claude/.claude
                        - name: scripts
                          mountPath: /scripts
                        - name: prompt
                          mountPath: /prompts
                        - name: proxy-certs
                          mountPath: /certs
                          readOnly: true
                      resources:
                        requests:
                          memory: "512Mi"
                          cpu: "200m"
                        limits:
                          memory: "1Gi"
                          cpu: "1000m"
